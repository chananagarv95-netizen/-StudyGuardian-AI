name: child_app
description: StudyGuardian AI - Child Monitoring App
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared:
    path: ../shared
  flutter_riverpod: ^2.6.1
  go_router: ^17.1.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_messaging: ^16.4.3
  google_sign_in: ^6.2.0
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^18.0.0
  google_fonts: ^6.2.0
  connectivity_plus: ^6.0.0
  workmanager: ^0.5.2
  battery_plus: ^6.0.0
  device_info_plus: ^10.1.0
  permission_handler: ^11.3.0
  intl: ^0.19.0
  uuid: ^4.4.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
