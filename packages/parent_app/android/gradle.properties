# =============================================================================
# StudyGuardian Parent App — Gradle Properties
# =============================================================================

# AndroidX migration
android.useAndroidX=true

# JVM memory allocation for Gradle daemon
org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable build config field generation
android.defaults.buildfeatures.buildconfig=true

# Disable non-transitive R classes for compatibility
android.nonTransitiveRClass=false

# Disable non-final resource IDs for compatibility with some libraries
android.nonFinalResIds=false

# Enable Gradle build caching for faster incremental builds
org.gradle.caching=true

# Enable parallel project execution
org.gradle.parallel=true

# Use the configuration cache for faster builds
org.gradle.configuration-cache=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
